# qengine-wayland.conf — drop-in for qengine.service: Engine as a window in
# qengine-sway.service instead of on the display itself. Install as
# /etc/systemd/system/qengine.service.d/wayland.conf. The size is the window
# sway-rx3.config gives Engine; this overrides SCREEN and QT_SCALE_FACTOR in
# pi.env, which keeps its eglfs settings for booting without it.
[Unit]
Requires=qengine-sway.service
After=qengine-sway.service

[Service]
Environment=PLATFORM=wayland "SCREEN=1280 800" QT_SCALE_FACTOR=
