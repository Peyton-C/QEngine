# rx3-wayland.conf — drop-in for the XDJ-RX3 player's rx3.service: start it
# once qengine-sway.service is up. RX3_DISPLAY=wayland in the player's rx3.conf
# is what makes it a window. Install as
# /etc/systemd/system/rx3.service.d/wayland.conf.
[Unit]
Requires=qengine-sway.service
After=qengine-sway.service
